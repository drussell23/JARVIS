# The Gradle version this build runs on — the thing that was missing.
#
# Without this file the project had no opinion about its own build tool, so the
# VS Code Gradle extension supplied its latest (9.2.0) and the plugin of the day
# happened to be incompatible with it. Nothing in the repo had changed. Pinning
# here makes the Mac, the Windows box and CI agree, and makes any future Gradle
# upgrade a reviewed commit instead of a surprise.
#
# 9.2.0 is chosen because it is the version already proven to run in this
# environment, and it satisfies both constraints the build now has:
#   IntelliJ Platform Gradle Plugin 2.18.1 -> requires Gradle >= 9.0
#   Kotlin Gradle Plugin 2.4.10            -> supports Gradle <= 9.5.0
#
# distributionSha256Sum is deliberately not set here because it must be the
# real published checksum, and a wrong one fails the build louder than an
# absent one. Add it with:
#     ./gradlew wrapper --gradle-version 9.2.0 --gradle-distribution-sha256-sum <sum>
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
