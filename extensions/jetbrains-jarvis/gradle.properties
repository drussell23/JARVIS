# JARVIS Observability — build coordinates.
#
# Every version this build depends on lives HERE, not inside build.gradle.kts,
# so a bump is a one-line edit in a data file rather than a script change. This
# is the layout the official IntelliJ Platform plugin template uses; the build
# script reads each value through `providers.gradleProperty(...)`.
#
# Why this file exists at all: before 2026-08-27 this build pinned NOTHING —
# no Gradle wrapper, no toolchain, no properties. It ran on whatever Gradle and
# JDK the machine happened to offer, which is how a working checkout started
# failing on a Mac whose IDE had moved to Gradle 9.2 / JDK 25 while nothing in
# the repo had changed.

pluginGroup = com.drussell23
pluginVersion = 0.1.0

# ---------------------------------------------------------------------------
# IntelliJ Platform
# ---------------------------------------------------------------------------
# The platform the plugin COMPILES against. 2023.3 is the floor: the IntelliJ
# Platform Gradle Plugin 2.x does not support targets earlier than that, which
# is what moved this build off 2023.2.6 (see pluginSinceBuild below).
#
# VERIFY THIS PIN on first build. If this exact patch release is not in the
# JetBrains repository the build fails with a dependency-resolution error
# naming it — change this one line, nothing else.
platformType = IC
platformVersion = 2023.3.8

# Build-number compatibility range advertised in plugin.xml.
#   233 == 2023.3 — raised from 232, forced by the 2.x minimum above.
# untilBuild is intentionally LEFT OPEN. The previous value ("243.*") capped
# the plugin at 2024.3, so on any newer IDE it would refuse to install — a
# self-inflicted expiry on an internal read-only tool. Set a value here only
# if a real incompatibility is found.
pluginSinceBuild = 233
pluginUntilBuild =

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
# Declared, not inherited. The build provisions this JDK itself, so it produces
# the same bytecode on the M1 laptop (Homebrew JDK 25), on the Windows box
# (Temurin 21), and in CI. 17 is the IntelliJ Platform 2023.3 requirement.
javaVersion = 17

# ---------------------------------------------------------------------------
# Gradle daemon
# ---------------------------------------------------------------------------
# 16GB M1 territory: the IntelliJ SDK resolution and Kotlin compilation are the
# memory-hungry steps. 2g is enough for both and leaves the machine usable.
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching = true

# Configuration cache is deliberately NOT enabled. It is the single most
# common source of "works for me / fails for you" breakage when combined with
# a plugin that touches the filesystem during configuration, and this build has
# just moved to a new major version of both its plugins. Turn it on as a
# separate, verified change once the migration is known green — not in the same
# commit that is trying to prove the migration itself.
# org.gradle.configuration-cache = true

# org.gradle.parallel is omitted on purpose: this is a single-project build,
# so it buys nothing and costs another daemon's worth of memory on a 16GB
# machine already running the agent.
