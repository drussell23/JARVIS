[pytest]
# Pytest configuration for JARVIS AI Agent

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
# `tests` is the modular suite. The `test_*.py` glob (pytest >= 8) additionally
# picks up the 65 legacy root-level test modules that were invisible to CI while
# this was pinned to `tests` alone. Root collection is gated by ./conftest.py,
# which drops script-only and import-unsafe files; norecursedirs below keeps the
# glob from descending into vendored//generated trees.
testpaths = tests test_*.py

# Minimum version
minversion = 6.0

# Add current directory to Python path
pythonpath = . backend

# Console output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    integration_mock: Mock-mode cross-repo integration tests (CI-safe, <60s)
    integration_real: Real-mode cross-repo integration tests (staging only)
    functional: Functional tests for features
    performance: Performance and load tests
    e2e: End-to-end system tests
    vision: Vision system tests
    voice: Voice system tests
    backend: Backend tests
    frontend: Frontend tests
    slow: Tests that take a long time to run
    api: Tests requiring API keys
    permissions: Tests requiring system permissions (screen/mic)
    skip_ci: Skip in CI environment
    asyncio: Async tests using pytest-asyncio

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    .venv
    env
    node_modules
    frontend/node_modules
    backend/venv
    .worktrees
    .ouroboros
    .jarvis
    .jarvis_cache
    .livefire
    archive
    pytest-of-*
    a1_runs
    a1_iso_runs
    a1_brain_runs
    autopsy_reports
    __pycache__

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=backend --cov-report=html --cov-report=term

# Timeout for tests (in seconds) - enforced via pytest-timeout
# thread method works across asyncio, audio, and blocking I/O
timeout = 120
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
